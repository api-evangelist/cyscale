aid: cyscale
name: Cyscale
description: >-
  Cyscale is an agentless, cloud-native application protection platform (CNAPP)
  that continuously monitors multi-cloud environments to surface, contextualize,
  and prioritize security risk. It unifies Cloud Security Posture Management
  (CSPM), Cloud Infrastructure Entitlement Management (CIEM), Kubernetes Security
  Posture Management (KSPM), and Data Security Posture Management (DSPM) into a
  single control plane, using a graph-based "Security Knowledge Graph" to map
  relationships between misconfigurations, vulnerabilities, identities, and data
  so teams know what to fix first. Cyscale connects to AWS, Azure, Google Cloud,
  and identity providers through secure, provider-native mechanisms and maps
  findings to compliance frameworks such as ISO 27001, SOC 2, PCI DSS, and NIST.
  Cyscale is a Seedcamp portfolio company; it exposes API keys for CI/CD and
  developer-tool integrations but does not publish a versioned public REST API
  specification.
